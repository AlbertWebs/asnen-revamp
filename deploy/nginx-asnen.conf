# ASNEN prototype — isolated subdomain only.
# Does not alter designekta.com, staging, econfirm, or expresscarwash.

server {
    listen 80;
    listen [::]:80;
    server_name asnen.designekta.com;

    root /var/www/asnen/public;
    index index.php index.html;
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
